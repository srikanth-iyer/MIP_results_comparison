[pytest]
# Pytest configuration for GenX Analysis project

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Directories to search for tests
testpaths = tests

# Minimum Python version
minversion = 7.0

# Command line options to always use
addopts =
    # Verbose output
    -v
    # Show summary of all test outcomes
    -ra
    # Show local variables in tracebacks
    --showlocals
    # Enable strict markers (must be defined in pytest_configure)
    --strict-markers
    # Warnings
    -W ignore::DeprecationWarning
    -W ignore::PendingDeprecationWarning

# Note: Coverage options removed from defaults.
# Run with coverage using: pytest --cov --cov-report=html

# Markers for categorizing tests
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, multiple components)
    slow: Slow tests (long running, can be skipped with -m "not slow")
    requires_data: Tests that require actual GenX data files

# Coverage configuration
[coverage:run]
source = .
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*
    */env/*
    */.venv/*
    */dist/*
    */build/*
    */docs/*
    setup.py

[coverage:report]
# Fail if coverage is below this threshold
# Set to 0 initially, increase as you add more tests
fail_under = 0
precision = 2
show_missing = True
skip_covered = False

exclude_lines =
    # Standard exclusions
    pragma: no cover
    def __repr__
    def __str__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abstract
    # Debug code
    if verbose:
    if debug:

[coverage:html]
directory = htmlcov
